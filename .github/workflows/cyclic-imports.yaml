name: Cyclic Imports
on:
  workflow_call:
  workflow_dispatch:  # to trigger manually

permissions:
  contents: read

jobs:
  cyclic-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@v0.0.4

      - name: check argos
        run: |
          python -c "import argos"
      - name: check argos.equality
        run: |
          python -c "from argos import equality"
          python -c "from argos.equality import handler"
          python -c "from argos.equality import tester"

      - name: check argos.iterator
        run: |
          python -c "from argos import iterator"
          python -c "from argos.iterator import bfs"
          python -c "from argos.iterator import dfs"

      - name: check argos.nested
        run: |
          python -c "from argos import nested"
      - name: check argos.random
        run: |
          python -c "from argos import random"
      - name: check argos.recursive
        run: |
          python -c "from argos import recursive"
      - name: check argos.reducer
        run: |
          python -c "from argos import reducer"
      - name: check argos.registry
        run: |
          python -c "from argos import registry"
      - name: check argos.summary
        run: |
          python -c "from argos import summary"
      - name: check argos.utils
        run: |
          python -c "from argos import utils"
